services:
  db:
    image: postgres:16-alpine
    container_name: fintech-db
    environment:
      POSTGRES_USER: ${DB_USER:-fintech}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fintech}
      POSTGRES_DB: ${DB_NAME:-fintech_bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fintech} -d ${DB_NAME:-fintech_bot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: fintech-searxng
    volumes:
      - ./configs/searxng:/etc/searxng:rw
    ports:
      - "8888:8080"
    environment:
      - BASE_URL=http://localhost:8888/
      - INSTANCE_NAME=Fintech Research Search
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintech-bot
    depends_on:
      db:
        condition: service_healthy
      searxng:
        condition: service_started
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DATABASE_URL=postgres://${DB_USER:-fintech}:${DB_PASSWORD:-fintech}@db:5432/${DB_NAME:-fintech_bot}?sslmode=disable
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_API_URL=${OPENROUTER_API_URL:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-deepseek/deepseek-chat}
      - GIGACHAT_AUTH_KEY=${GIGACHAT_AUTH_KEY:-}
      - GIGACHAT_CLIENT_ID=${GIGACHAT_CLIENT_ID:-}
      - GIGACHAT_CLIENT_SECRET=${GIGACHAT_CLIENT_SECRET:-}
      - SEARCH_PROVIDER=${SEARCH_PROVIDER:-searxng}
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://searxng:8080}
      - SEARXNG_TIMEOUT_SEC=${SEARXNG_TIMEOUT_SEC:-30}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - TAVILY_BASE_URL=${TAVILY_BASE_URL:-https://api.tavily.com}
      - TAVILY_TIMEOUT_SEC=${TAVILY_TIMEOUT_SEC:-30}
      - AGENT_MANDATES_ENABLED=${AGENT_MANDATES_ENABLED:-true}
      - AGENT_PLANNER_ENABLED=${AGENT_PLANNER_ENABLED:-false}
      - AGENT_STRUCTURED_OUTPUT_ENABLED=${AGENT_STRUCTURED_OUTPUT_ENABLED:-false}
      - AGENT_SERIAL_EXECUTION=${AGENT_SERIAL_EXECUTION:-false}
      - AGENT_REQUEST_DELAY_SECONDS=${AGENT_REQUEST_DELAY_SECONDS:-0}
      - AGENT_COORDINATOR_DISABLED=${AGENT_COORDINATOR_DISABLED:-false}
      - SEARCH_DOMAIN_FILTER_DISABLED=${SEARCH_DOMAIN_FILTER_DISABLED:-false}
      - EVAL_DISABLE_CRITIC=${EVAL_DISABLE_CRITIC:-false}
      - EVAL_DISABLE_QUERY_EXPANSION=${EVAL_DISABLE_QUERY_EXPANSION:-false}
      - EVAL_DISABLE_WORLD_MODEL=${EVAL_DISABLE_WORLD_MODEL:-false}
      - QUERY_EXPANSION_DISABLED=${QUERY_EXPANSION_DISABLED:-false}
      - WORLD_MODEL_DISABLED=${WORLD_MODEL_DISABLED:-false}
      - EVAL_MAX_QUERIES=${EVAL_MAX_QUERIES:-}
      - EVAL_MAX_RESULTS=${EVAL_MAX_RESULTS:-}
      - EVAL_QUERY_TIMEOUT_SECONDS=${EVAL_QUERY_TIMEOUT_SECONDS:-240}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "${BOT_HTTP_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
